[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "retrokit"
dynamic = ["version"]
description = "Headless Ghidra toolkit for reverse engineering old DOS (LE/LX, Watcom) and Win32 PE games"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["capstone>=5"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Disassemblers",
]

[project.optional-dependencies]
images = ["Pillow"]

[project.scripts]
retrokit = "retrokit.cli:main"

[tool.setuptools]
packages = ["retrokit"]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "retrokit.__version__" }

[tool.setuptools.package-data]
retrokit = [
    "ghidra_scripts/*.java",
    "tools/*.py",
    "sigs/*.sig.gz",
    "knowledge/*.h",
    "knowledge/*.json",
    "knowledge/win32/*.h",
    "le-loader/*",
    "le-loader/data/**/*",
    "le-loader/src/**/*",
]
