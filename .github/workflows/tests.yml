name: tests

on:
  push:
  pull_request:

env:
  GHIDRA_TAG: Ghidra_12.1.4_build
  GHIDRA_ZIP: ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_DIR: ghidra_12.1.4_PUBLIC
  OW_TAG: 2026-09-01-Build

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install capstone
      - run: python -m unittest discover -s tests -v

  pipeline:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install capstone

      - name: Cache Ghidra and Open Watcom
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/${{ env.GHIDRA_DIR }}
            ${{ runner.temp }}/openwatcom
          key: tools-${{ env.GHIDRA_TAG }}-${{ env.OW_TAG }}

      - name: Download Ghidra and Open Watcom
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          gh release download $env:GHIDRA_TAG -R NationalSecurityAgency/ghidra -p $env:GHIDRA_ZIP -D $env:RUNNER_TEMP
          Expand-Archive (Join-Path $env:RUNNER_TEMP $env:GHIDRA_ZIP) $env:RUNNER_TEMP
          gh release download $env:OW_TAG -R open-watcom/open-watcom-v2 -p ow-snapshot.tar.xz -D $env:RUNNER_TEMP
          New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP openwatcom) | Out-Null
          tar -xJf (Join-Path $env:RUNNER_TEMP ow-snapshot.tar.xz) -C (Join-Path $env:RUNNER_TEMP openwatcom)

      - name: Install LE loader
        shell: pwsh
        run: pwsh ghidra-lx-loader/build.ps1 -GhidraDir (Join-Path $env:RUNNER_TEMP $env:GHIDRA_DIR)

      - name: Build fixtures, run pipeline, compare with baseline
        shell: pwsh
        run: |
          $env:GHIDRA_INSTALL_DIR = Join-Path $env:RUNNER_TEMP $env:GHIDRA_DIR
          $env:WATCOM = Join-Path $env:RUNNER_TEMP openwatcom
          python tests/run_tests.py -v
          python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: analyze-logs
          path: tests/fixtures/build/*/analyze.log
