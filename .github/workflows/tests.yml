name: tests

on:
  push:
  pull_request:

env:
  GHIDRA_TAG: Ghidra_12.1.4_build
  GHIDRA_ZIP: ghidra_12.1.4_PUBLIC_20260921.zip
  GHIDRA_DIR: ghidra_12.1.4_PUBLIC
  OW_TAG: 2026-09-01-Build

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - run: retrokit --help
      - run: python -m unittest discover -s tests -v

  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # the Linux run is not verified yet
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install -e .

      - name: Cache Ghidra and Open Watcom
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/${{ env.GHIDRA_DIR }}
            ${{ runner.temp }}/openwatcom
          key: tools-${{ runner.os }}-${{ env.GHIDRA_TAG }}-${{ env.OW_TAG }}

      - name: Download Ghidra and Open Watcom
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          gh release download "$GHIDRA_TAG" -R NationalSecurityAgency/ghidra -p "$GHIDRA_ZIP" -D "$RUNNER_TEMP"
          python -c "import zipfile,sys; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" "$RUNNER_TEMP/$GHIDRA_ZIP" "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/$GHIDRA_DIR/support/"* "$RUNNER_TEMP/$GHIDRA_DIR/Ghidra/Features/Decompiler/os/"*/* || true
          gh release download "$OW_TAG" -R open-watcom/open-watcom-v2 -p ow-snapshot.tar.xz -D "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/openwatcom"
          tar -xJf "$RUNNER_TEMP/ow-snapshot.tar.xz" -C "$RUNNER_TEMP/openwatcom"

      - name: Install LE loader
        shell: bash
        run: retrokit install-loader --ghidra "$RUNNER_TEMP/$GHIDRA_DIR"

      - name: Doctor
        shell: bash
        run: retrokit doctor --ghidra "$RUNNER_TEMP/$GHIDRA_DIR"

      - name: Build fixtures, run pipeline, compare with baseline
        shell: bash
        run: |
          export GHIDRA_INSTALL_DIR="$RUNNER_TEMP/$GHIDRA_DIR" WATCOM="$RUNNER_TEMP/openwatcom"
          python tests/run_tests.py -v
          python -m unittest discover -s tests -v

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: analyze-logs-${{ matrix.os }}
          path: |
            tests/fixtures/build/*/analyze.log
            tests/fixtures/build/*/analysis/logs/*.log
